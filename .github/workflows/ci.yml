# =====================================================================
# CI —— ★ 审计修复 P1-E12（建立 CI：pytest + verify + build）
#
# 三道守卫与本地完全一致，缺一不可：
#   1) 后端 lint      ruff check           （配置 backend/ruff.toml）
#   2) 后端测试      pytest               （tests/conftest.py 强制 simulate=always +
#                                           EFORT_REAL_MOTION=0 + 临时库 → CI 绝不碰真机）
#   3) 前端守卫      npm run verify       （静态导入/引号守卫 + 20 个无头回归套件）
#   4) 前端构建      npm run build        （静态守卫内置 + vite 生产构建）
#
# 取 windows-latest：交付形态就是 Windows（.bat 启动脚本、GBK 控制台、本地盘路径），
# 在 Linux 上跑绿不能代表现场能跑。
#
# 本地复现（顺序与本文件一一对应）：
#   cd backend  && python -m pip install -r requirements-dev.txt -r requirements.lock
#              && python -m ruff check . && python -m pytest
#   cd frontend && npm ci && npm run verify && npm run build
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端 · ruff + pytest
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # 用 lock 作为缓存键：依赖变了才重建环境，避免每次都全量装。
          cache-dependency-path: backend/requirements.lock

      - name: 安装依赖（范围 + 精确锁定）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements.lock
          python -m pip check

      - name: lint（ruff）
        run: python -m ruff check .

      # ★ conftest 在导入 app 之前就把 simulate/real_motion/DB 钉死，
      #   这里**不要**再额外设置 EFORT_* 环境变量 —— 那会掩盖 conftest 的保护。
      - name: 测试（pytest）
        run: python -m pytest

  frontend:
    name: 前端 · verify + build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 回归守卫（eslint + check + 20 个 verify 套件）
        run: npm run verify

      - name: 生产构建
        run: npm run build
