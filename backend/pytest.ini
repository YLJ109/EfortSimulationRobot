# =====================================================================
# pytest 入口约定 —— ★ 审计修复 P1-E13（建立 lint/测试配置）
#
# 为什么需要它：之前没有配置文件，直接在仓库根目录敲 `pytest` 会从根开始扫描，
#   把 camera/、scripts/ 之类的目录也当成测试收集目标，还找不到 tests/conftest.py
#   里的环境强制项 —— 一旦有人误跑，就可能在**真实 .env** 下连真机。
#   现在把测试目录与默认参数钉在这里，`cd backend && pytest` 恒等于同一件事。
#
# ★ 安全底线（与本文件无关，但和它一起生效）：tests/conftest.py 在导入 app 之前
#   强制 EFORT_SIMULATE=always + EFORT_REAL_MOTION=0 + 临时 EFORT_DB_URL，
#   所以无论本机 .env 怎么写，测试都不会连 192.168.1.12、不会写真机、不会污染运行库。
# =====================================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q
